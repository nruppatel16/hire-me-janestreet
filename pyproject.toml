[project]
name = "xmatch"
version = "0.1.0"
description = "Read-only cross-market matching pipeline for Kalshi and Polymarket"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.5.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
xmatch = "xmatch.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local Postgres (scripts/db.sh init)"]
